name: validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.python }}
      - run: cargo build -p cargo-statement-spacing --locked
      - run: python -m unittest discover -s crates/cli/tests -v
      - run: cargo run -p source-policy --locked
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            lint
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo +stable fmt --manifest-path lint/Cargo.toml -- --check
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: python3 scripts/validate.py --portable-only
  real-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Dylint binaries and drivers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.dylint_drivers
          key: dylint-${{ runner.os }}-6.0.4-nightly-2026-05-28
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            lint
      - run: bash scripts/bootstrap.sh
      - run: python3 scripts/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-rust-validation
          path: |
            validation-output/
            Cargo.lock
            lint/Cargo.lock
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cargo-statement-spacing --locked
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s crates/cli/tests -v
