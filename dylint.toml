[statement_spacing]
schema_version = 1
enable = ["layout"]
exclude = ["**/fixtures/**"]
include_generated = false

[statement_spacing.grouping]
bindings = "multiline"
expressions = "multiline"
join_related = true
self_fields = "distinct"

[statement_spacing.control_flow]
guard_chain = "contextual"
related_continuation = false

[statement_spacing.exits]
tail = "visual"
