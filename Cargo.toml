[package]
name = "rust-statement-spacing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "A configurable Rust linter for semantic blank-line placement and statement grouping, with autofixes."
authors = ["zigai <ziga.ivansek@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zigai/rust-statement-spacing"
homepage = "https://github.com/zigai/rust-statement-spacing"
documentation = "https://docs.rs/rust-statement-spacing"
readme = "README.md"
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "benches/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE*",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]

[dev-dependencies]

[workspace]
resolver = "3"

[lints]
workspace = true

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
panic = "warn"
redundant_clone = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
